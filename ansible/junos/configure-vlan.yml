---
- name: Create a VLAN
  hosts: cjunosevolved
  connection: juniper.device.pyez
  collections:
    - juniper.device

  tasks:
    - name: Verify NETCONF connectivity
      wait_for:
        host: "{{ inventory_hostname }}"
        port: 830
        connect_timeout: 45

    - name: "Configure the VLAN"
      juniper.device.config:
        load: set
        lines:
         - set vlans vlan130 vlan-id 130
         - set interfaces irb unit 130 family inet address 130.0.0.1/24
         - set vlans vlan130 l3-interface irb.130
         - set system login message "Banner set by Ansible!"
        timeout: 45
        commit: yes
