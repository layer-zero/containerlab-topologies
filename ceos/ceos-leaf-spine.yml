---
name: ceos-leaf-spine
prefix: ''

topology:
  defaults:
    kind: arista_ceos
    image: ceos:4.34.4M
  kinds:
    arista_ceos:
      env:
        CLAB_MGMT_VRF: MGMT

  nodes:
    spine1:
      mgmt-ipv4: 172.20.20.11
    spine2:
      mgmt-ipv4: 172.20.20.12
    leaf1:
      mgmt-ipv4: 172.20.20.21
    leaf2:
      mgmt-ipv4: 172.20.20.22
    leaf3:
      mgmt-ipv4: 172.20.20.23
    leaf4:
      mgmt-ipv4: 172.20.20.24
    host1:
      mgmt-ipv4: 172.20.20.51
    host2:
      mgmt-ipv4: 172.20.20.52

  links:
    - endpoints: ["spine1:eth1", "spine2:eth1"]
    - endpoints: ["spine1:eth2", "spine2:eth2"]
    - endpoints: ["spine1:eth3", "leaf1:eth3"]
    - endpoints: ["spine1:eth4", "leaf2:eth3"]
    - endpoints: ["spine1:eth5", "leaf3:eth3"]
    - endpoints: ["spine1:eth6", "leaf4:eth3"]
    - endpoints: ["spine2:eth3", "leaf1:eth4"]
    - endpoints: ["spine2:eth4", "leaf2:eth4"]
    - endpoints: ["spine2:eth5", "leaf3:eth4"]
    - endpoints: ["spine2:eth6", "leaf4:eth4"]
    - endpoints: ["leaf1:eth1", "leaf2:eth1"]
    - endpoints: ["leaf1:eth2", "leaf2:eth2"]
    - endpoints: ["leaf3:eth1", "leaf4:eth1"]
    - endpoints: ["leaf3:eth2", "leaf4:eth2"]
    - endpoints: ["host1:eth1", "leaf1:eth5"]
    - endpoints: ["host1:eth2", "leaf2:eth5"]
    - endpoints: ["host1:eth3", "leaf1:eth6"]
    - endpoints: ["host1:eth4", "leaf2:eth6"]
    - endpoints: ["host2:eth1", "leaf3:eth5"]
    - endpoints: ["host2:eth2", "leaf4:eth5"]
    - endpoints: ["host2:eth3", "leaf3:eth6"]
    - endpoints: ["host2:eth4", "leaf4:eth6"]
