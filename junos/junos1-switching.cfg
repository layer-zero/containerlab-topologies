version 25.2R1.8-EVO;
groups {
    LINK-AGGREGATION {
        chassis {
            aggregated-devices {
                ethernet {
                    device-count 8;
                }
            }
        }
        interfaces {
            et-0/0/0 {
                ether-options {
                    802.3ad ae0;
                }
            }
            et-0/0/1 {
                ether-options {
                    802.3ad ae0;
                }
            }
            ae0 {
                aggregated-ether-options {
                    lacp {
                        active;
                    }
                }
                unit 0 {
                    family ethernet-switching {
                        interface-mode trunk;
                        vlan {
                            members all;
                        }
                    }
                }
            }
        }
    }
    VLANS {
        interfaces {
            et-0/0/2 {
                unit 0 {
                    family ethernet-switching {
                        vlan {
                            members RED;
                        }
                    }
                }
            }
            et-0/0/3 {
                unit 0 {
                    family ethernet-switching {
                        vlan {
                            members BLUE;
                        }
                    }
                }
            }
        }
        vlans {
            BLUE {
                vlan-id 102;
            }
            RED {
                vlan-id 101;            
                l3-interface irb.101;
            }
            TRANSIT {
                vlan-id 10;
                l3-interface irb.10;
            }
        }
    }
    IP-ROUTING {
        interfaces {
            irb {
                unit 10 {
                    family inet {
                        address 10.255.255.1/30;
                    }
                }
                unit 101 {
                    family inet {
                        address 10.1.1.254/24;
                    }
                }
            }
        }
        routing-options {
            static {
                route 10.2.2.0/24 next-hop 10.255.255.2;
            }
        }
    }
}
apply-groups [ LINK-AGGREGATION VLANS IP-ROUTING ];
